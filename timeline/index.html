<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 🎯 CRITICAL MOBILE RESIZING FIX: Forces phone screens to scale content perfectly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌦️ Atmosphere OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="Icon.png" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="Icon.png">
  <meta name="theme-color" content="#0d1117">
  
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-wrapper {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(180deg, #b7791f 0%, #8b5e1d 100%);
      border: 1px solid #4b3d2c;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-size: 24px;
      color: #f0f6fc;
      margin-bottom: 4px;
    }

    .app-header p {
      font-size: 14px;
      color: #8b949e;
    }

    /* ==========================================
       SEARCH BOX INPUT & BUTTON RESPONSIVENESS
       ========================================== */
    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      width: 100%;
    }

    #city-input {
      flex: 1;
      background-color: #0d1117;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px; /* Prevents mobile browsers from zooming on tap */
      outline: none;
      width: 100%;
    }

    #city-input:focus {
      border-color: #58a6ff;
    }

    #search-btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #search-btn:hover {
      background-color: #2ea043;
    }

    .weather-card {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }

    #location-name {
      font-size: 20px;
      color: #f0f6fc;
      margin-bottom: 12px;
    }

    .metrics-display {
      margin: 16px 0;
    }

    #temperature-digits {
      font-size: 48px;
      font-weight: bold;
      color: #58a6ff;
    }

    .unit {
      font-size: 24px;
      color: #8b949e;
      vertical-align: super;
    }

    #weather-condition {
      font-size: 14px;
      color: #8b949e;
    }

    #offline-banner {
      width: 100%;
      max-width: 400px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="offline-banner"></div>

  <main class="app-wrapper">
    
    <header class="app-header">
      <h1>🌦️ Atmosphere OS</h1>
      <p>Meteorological Intelligence</p>
    </header>

    <section class="search-container">
      <input type="text" id="city-input" placeholder="Enter target city name...">
      <button id="search-btn">Fetch</button>
    </section>

    <section class="weather-card">
      <h2 id="location-name">----</h2>
      
      <div class="metrics-display">
        <span id="temperature-digits">--</span><span class="unit">°C</span>
      </div>
      
      <p id="weather-condition">Please execute a location query above.</p>
    </section>

  </main>

  <!-- Wire up your persistent JavaScript execution layer -->
  <script src="app.js"></script>
</body>
</html>
